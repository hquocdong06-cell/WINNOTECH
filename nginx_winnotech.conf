server {
    listen 80;
    server_name winnotech.io.vn www.winnotech.io.vn 103.106.104.186;

    # Nơi chứa file Frontend React đã build (dist)
    root /var/www/WINNOTech/frontend/dist;
    index index.html;

    # Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy tất cả API & Ảnh sang Node.js Backend (Port 3000)
    location ~ ^/(api|auth|cart|products|categories|order|reviews|compare|vouchers|buildpc|chatbot|public|login|register) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
